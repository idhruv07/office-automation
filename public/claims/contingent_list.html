<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Saved Contingent Bills - Office Auto</title>
    <link rel="stylesheet" href="/assets/style.css">
</head>
<!-- ══════════════════════════════════════════════════
         SAVED CONTINGENT BILLS — Premium Card Dashboard
    ══════════════════════════════════════════════════ -->
<div class="profile-id-card-wrapper" style="margin-top: 1.5rem; max-width: 1100px;">
    <div class="profile-id-card">
        <!-- Decorative blobs -->
        <div class="profile-blob profile-blob-1"></div>
        <div class="profile-blob profile-blob-2"></div>
        <div class="profile-blob profile-blob-3"></div>

        <!-- Avatar + Title Hero -->
        <div class="profile-hero" style="margin-bottom: 24px; align-items: center;">
            <div class="profile-avatar-wrap">
                <span class="profile-avatar-img"
                    style="display: flex; align-items: center; justify-content: center; font-size: 2.25rem; background: rgba(255, 255, 255, 0.2); border-radius: 50%; width: 70px; height: 70px; box-shadow: 0 4px 15px rgba(0,0,0,0.15);">📂</span>
            </div>
            <div class="profile-hero-text">
                <div class="profile-badge">Accounting & Finance</div>
                <h2 class="profile-hero-name"
                    style="font-size: 1.8rem; margin: 0; font-weight: 800; text-shadow: 0 2px 4px rgba(0,0,0,0.15);">
                    Saved Contingent Bills</h2>
                <div class="profile-hero-sub" style="font-size: 0.9rem; opacity: 0.85; margin-top: 4px;">Manage and
                    submit your office contingent reimbursement claims</div>
            </div>
        </div>

        <!-- Two Column Layout: Left Tree Panel, Right Table Panel -->
        <div style="display: flex; gap: 24px; position: relative; z-index: 5; margin-top: 12px; align-items: flex-start; flex-wrap: wrap;">
            
            <!-- Left Side: Folder Directory Tree -->
            <div style="flex: 0 0 280px; width: 280px; display: flex; flex-direction: column;">
                <label style="display: block; font-size: 0.75rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; color: rgba(255, 255, 255, 0.8); margin-bottom: 10px;">Folder Directory</label>
                <div id="folder-list" style="display: flex; flex-direction: column; gap: 4px; width: 100%; background: rgba(255, 255, 255, 0.05); padding: 12px; border-radius: 12px; border: 1px solid rgba(255, 255, 255, 0.1);">
                    <!-- Dynamic glassmorphic folder buttons will go here -->
                </div>
            </div>

            <!-- Right Side: Ledger Table -->
            <div style="flex: 1; min-width: 500px; display: flex; flex-direction: column;">
                <!-- Info metrics chips row inside right panel -->
                <div class="profile-chips-row" style="margin-bottom: 16px;">
                    <div class="profile-chip">
                        <span class="profile-chip-icon">🗂️</span>
                        <div>
                            <div class="profile-chip-label">Active Directory</div>
                            <div id="current-folder-title" class="profile-chip-val" style="font-size: 0.85rem; font-weight: 800;">Root Folder</div>
                        </div>
                    </div>
                    <div class="profile-chip">
                        <span class="profile-chip-icon">📊</span>
                        <div>
                            <div class="profile-chip-label">Total Bills Found</div>
                            <div id="result-count" class="profile-chip-val" style="font-size: 0.85rem; font-weight: 800;">0 Results</div>
                        </div>
                    </div>
                </div>

                <h4 style="font-size: 1rem; font-weight: 800; color: white; margin-bottom: 12px; display: flex; align-items: center; gap: 8px;">
                    <span>📄</span> Contingent Bills Ledger
                </h4>
                <div class="table-container">
                    <div id="contingent-list-content">
                        <p class="text-center font-bold" style="color: rgba(255,255,255,0.75);">Loading contingent bills...</p>
                    </div>
                </div>
            </div>
            
        </div>
    </div>
</div>

<script src="/assets/menu.js"></script>
<script src="/assets/layout.js"></script>
<script src="/assets/contingent_list.js"></script>
</body>

</html>
