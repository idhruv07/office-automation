<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Claims - Office Auto</title>
    <link rel="stylesheet" href="/assets/style.css">
</head>
<body>
    <!-- ══════════════════════════════════════════════════
         MY CLAIMS — Premium Card Dashboard
    ══════════════════════════════════════════════════ -->
    <div class="profile-id-card-wrapper" style="margin-top: 1.5rem; max-width: 1100px;">
        <div class="profile-id-card">
            <!-- Decorative blobs -->
            <div class="profile-blob profile-blob-1"></div>
            <div class="profile-blob profile-blob-2"></div>
            <div class="profile-blob profile-blob-3"></div>

            <!-- Avatar + Title Hero -->
            <div class="profile-hero" style="margin-bottom: 24px; align-items: center;">
                <div class="profile-avatar-wrap">
                    <span class="profile-avatar-img" style="display: flex; align-items: center; justify-content: center; font-size: 2.25rem; background: rgba(255, 255, 255, 0.2); border-radius: 50%; width: 70px; height: 70px; box-shadow: 0 4px 15px rgba(0,0,0,0.15);">📑</span>
                </div>
                <div class="profile-hero-text">
                    <div class="profile-badge">Workspace</div>
                    <h2 class="profile-hero-name" style="font-size: 1.8rem; margin: 0; font-weight: 800; text-shadow: 0 2px 4px rgba(0,0,0,0.15);">My Claims</h2>
                    <div class="profile-hero-sub" style="font-size: 0.9rem; opacity: 0.85; margin-top: 4px;">Track status and manage all your submitted claim documents</div>
                </div>
            </div>

            <!-- Filters & Period Row -->
            <div style="margin-bottom: 24px; display: flex; gap: 15px; align-items: center; flex-wrap: wrap; position: relative; z-index: 5;">
                <div style="display: flex; gap: 10px; flex-wrap: wrap;">
                    <button id="btn-show-all" type="button" class="adm-filter-btn active">All Claims</button>
                    <button id="btn-show-submitted" type="button" class="adm-filter-btn">Submitted Claims</button>
                    <button id="btn-show-drafts" type="button" class="adm-filter-btn">My Drafts</button>
                    <button id="btn-show-returned" type="button" class="adm-filter-btn" style="position: relative;">
                        Returned Claims
                        <span id="returned-count" style="display: none; position: absolute; top: -10px; right: -10px; background: white; color: var(--danger-color); border: 2px solid var(--danger-color); border-radius: 50%; width: 20px; height: 20px; font-size: 11px; font-weight: bold; align-items: center; justify-content: center;">0</span>
                    </button>
                </div>
                
                <div class="view-period-box">
                    <label for="filter-year">View Period:</label>
                    <select id="filter-year">
                        <option value="">Recent (6 Months)</option>
                    </select>
                </div>
            </div>

            <!-- Nested Claims Ledger inside the Card -->
            <div style="position: relative; z-index: 5; margin-top: 12px;">
                <h4 id="view-title" style="font-size: 1.1rem; font-weight: 800; color: white; margin-bottom: 12px; display: flex; align-items: center; gap: 8px;">
                    All Claims
                </h4>
                <div class="table-container">
                    <div id="claims-dynamic-content">
                        <p class="text-center font-bold" style="color: rgba(255,255,255,0.75);">Loading claims...</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="/assets/menu.js"></script>
    <script src="/assets/layout.js"></script>
    <script src="/assets/claims_my.js"></script>
</body>
</html>
