<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Claims - Office Auto</title>
    <link rel="stylesheet" href="/assets/style.css">
    <style>
        table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        th, td { border: 1px solid var(--border-color); padding: 10px; text-align: left; }
        th { background-color: #f8f9fa; }
        .btn-sm { padding: 4px 8px; font-size: 12px; }
    </style>
</head>
<body>
    <h1>My Claims</h1>
    
    <div style="margin-bottom: 20px; display: flex; gap: 15px; align-items: center; flex-wrap: wrap;">
        <div style="display: flex; gap: 10px;">
            <button id="btn-show-all" type="button" style="background: #334155;">All Claims</button>
            <button id="btn-show-submitted" type="button" style="background: var(--primary-color);">Submitted Claims</button>
            <button id="btn-show-drafts" type="button" style="background: #6c757d;">My Drafts</button>
            <button id="btn-show-returned" type="button" style="background: #dc3545; position: relative;">
                Returned Claims
                <span id="returned-count" style="display: none; position: absolute; top: -10px; right: -10px; background: white; color: #dc3545; border: 2px solid #dc3545; border-radius: 50%; width: 20px; height: 20px; font-size: 11px; font-weight: bold; align-items: center; justify-content: center;">0</span>
            </button>
        </div>
        
        <div style="display: flex; align-items: center; gap: 10px; background: #f8fafc; padding: 5px 15px; border-radius: 20px; border: 1px solid #e2e8f0;">
            <label for="filter-year" style="font-weight: bold; font-size: 14px;">View Period:</label>
            <select id="filter-year" style="padding: 5px; border-radius: 4px; border: 1px solid #cbd5e1;">
                <option value="">Recent (6 Months)</option>
                <!-- Years will be populated by JS -->
            </select>
        </div>
    </div>

    <div id="claims-wrapper" style="background: white; padding: 20px; border-radius: 8px;">
        <h2 id="view-title">All Claims</h2>
        <div id="claims-dynamic-content">
            <!-- Dynamic tables grouped by type will appear here -->
            <p>Loading claims...</p>
        </div>
    </div>

    <script src="/assets/menu.js"></script>
    <script src="/assets/layout.js"></script>
    <script src="/assets/claims_my.js"></script>
</body>
</html>
