<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - Office Auto</title>
    <link rel="stylesheet" href="/assets/style.css">
</head>
<body>
    <h1>Admin Dashboard</h1>
    <p>Welcome, <span id="display-username"></span>!</p>
    
    <div style="display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 20px; margin-top: 20px;">
        <div style="background: white; padding: 20px; border-radius: 8px; border-left: 5px solid var(--primary-color);">
            <h3>User Management</h3>
            <p>Create and manage individual users.</p>
            <a href="/admin/users.html">Manage Users</a>
        </div>
        <div style="background: white; padding: 20px; border-radius: 8px; border-left: 5px solid orange;">
            <h3>All Claims</h3>
            <p>Review all submitted claims.</p>
            <a href="/admin/claims.html">View All</a>
        </div>
    </div>

    <script src="/assets/menu.js"></script>
    <script src="/assets/layout.js"></script>
    <script src="/assets/admin_dashboard.js"></script>
</body>
</html>
