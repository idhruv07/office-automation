<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Office Automation</title>
    <link rel="stylesheet" href="/assets/style.css">
</head>
<body class="login-page-body">
    <div id="login-container" class="profile-id-card-wrapper login-container">
        <div class="profile-id-card">
            <!-- Decorative blobs -->
            <div class="profile-blob profile-blob-1"></div>
            <div class="profile-blob profile-blob-2"></div>
            <div class="profile-blob profile-blob-3"></div>

            <div class="profile-hero login-hero-adjust">
                <div class="profile-hero-text w-full">
                    <div class="profile-badge">Office Automation</div>
                    <h2 class="profile-hero-name login-title">Welcome Back</h2>
                    <div class="profile-hero-sub login-subtitle">Secure Login Portal</div>
                </div>
            </div>
        </div>
        
        <div class="profile-edit-panel login-edit-panel">
            <div class="login-org-title">रक्षा लेखा महानियंत्रक</div>
            <form id="login-form">
                <div class="profile-edit-grid login-grid">
                    <div class="profile-edit-field">
                        <label for="username">Username</label>
                        <input type="text" id="username" placeholder="Enter your username" required>
                    </div>
                    <div class="profile-edit-field">
                        <label for="password">Password</label>
                        <input type="password" id="password" placeholder="Enter your password" required>
                    </div>
                </div>
                
                <div class="mt-5">
                    <button type="submit" class="btn-primary login-btn">Secure Login</button>
                </div>
            </form>
        </div>
    </div>

    <script src="/assets/menu.js"></script>
    <script src="/assets/layout.js"></script>
    <script src="/assets/login.js"></script>
</body>
</html>
