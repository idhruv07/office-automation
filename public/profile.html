<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Profile - Office Auto</title>
    <link rel="stylesheet" href="/assets/style.css">
</head>
<body>
    <h1>My Profile & Family Details</h1>

    <div class="form-container mx-auto max-w-800">
        <h3>Personal Details</h3>
        <form id="profile-form">
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 20px;">
                <div class="form-group" style="margin-bottom: 0;">
                    <label>Name</label>
                    <input type="text" id="prof_name" readonly class="bg-gray-100">
                </div>
                <div class="form-group" style="margin-bottom: 0;">
                    <label>Personal No.</label>
                    <input type="text" id="prof_personal_no" readonly class="bg-gray-100">
                </div>
                <div class="form-group" style="margin-bottom: 0;">
                    <label>Email</label>
                    <input type="email" id="prof_email">
                </div>
                <div class="form-group" style="margin-bottom: 0;">
                    <label>Mobile Number</label>
                    <input type="tel" id="prof_mobile_no">
                </div>
                <div class="form-group" style="margin-bottom: 0;">
                    <label>CGHS Beneficiary ID</label>
                    <input type="text" id="prof_cghs_ben_id">
                </div>
                <div class="form-group" style="margin-bottom: 0;">
                    <label>Pay Level</label>
                    <input type="text" id="prof_pay_level">
                </div>
                <div class="form-group" style="margin-bottom: 0;">
                    <label>Basic Pay (Rs.)</label>
                    <input type="text" id="prof_basic_pay">
                </div>
                <div class="form-group" style="margin-bottom: 0;">
                    <label>GPF A/C No.</label>
                    <input type="text" id="prof_gpf_ac_no" placeholder="e.g. 12345/AG">
                </div>
                <div class="form-group" style="margin-bottom: 0; grid-column: span 2;">
                    <label>Full Address</label>
                    <input type="text" id="prof_address">
                </div>
            </div>
            <div id="profile-status-message" class="hidden" style="padding: 10px; margin-bottom: 15px; border-radius: 6px; font-weight: 600; font-size: 0.9rem; text-align: center; transition: all 0.3s ease;"></div>
            <button type="submit" class="btn-primary w-full">Update Profile</button>
        </form>
    </div>

    <div class="form-container mx-auto max-w-800">
        <h3>Family Details (Dependents)</h3>
        <div class="table-container mb-6">
            <table>
                <thead>
                    <tr>
                        <th>Name</th>
                        <th>Relationship</th>
                        <th>CGHS Card ID</th>
                        <th>Date of Birth</th>
                        <th>Action</th>
                    </tr>
                </thead>
                <tbody id="dependents-table">
                </tbody>
            </table>
        </div>

        <h4 class="mt-5">Add / Edit Dependent</h4>
        <form id="dependent-form">
            <input type="hidden" id="dep_id">
            <div class="flex gap-4">
                <div class="form-group flex-1">
                    <label>Name</label>
                    <input type="text" id="dep_name" required>
                </div>
                <div class="form-group flex-1">
                    <label>Relationship</label>
                    <select id="dep_relationship" required>
                        <option value="">Select...</option>
                        <option value="Spouse">Spouse</option>
                        <option value="Husband">Husband</option>
                        <option value="Wife">Wife</option>
                        <option value="Son">Son</option>
                        <option value="Daughter">Daughter</option>
                        <option value="Father">Father</option>
                        <option value="Mother">Mother</option>
                        <option value="Brother">Brother</option>
                        <option value="Sister">Sister</option>
                        <option value="Father-in-law">Father-in-law</option>
                        <option value="Mother-in-law">Mother-in-law</option>
                    </select>
                </div>
            </div>
            <div class="flex gap-4">
                <div class="form-group flex-1">
                    <label>CGHS Card ID (Optional)</label>
                    <input type="text" id="dep_cghs_id">
                </div>
                <div class="form-group flex-1">
                    <label>Date of Birth</label>
                    <input type="date" id="dep_dob">
                </div>
            </div>
            <div class="flex gap-4 mt-5">
                <button type="submit" id="btn-save-dep" class="btn-primary">Save Dependent</button>
                <button type="button" id="btn-cancel-dep" class="btn-draft hidden">Cancel</button>
            </div>
        </form>
    </div>

    <script src="/assets/menu.js"></script>
    <script src="/assets/layout.js"></script>
    <script src="/assets/profile.js"></script>
</body>
</html>
