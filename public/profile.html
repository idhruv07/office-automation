<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Profile - Office Auto</title>
    <link rel="stylesheet" href="/assets/style.css">
</head>
<body>

    <div class="form-container mx-auto max-w-800">
        <h3>Personal Details</h3>
        <form id="profile-form">
            <div class="profile-layout-grid">
                <!-- Left Side: Inputs -->
                <div class="profile-inputs-pane">
                    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 20px;">
                        <div class="form-group" style="margin-bottom: 0;">
                            <label>Name</label>
                            <input type="text" id="prof_name" readonly class="bg-gray-100">
                        </div>
                        <div class="form-group" style="margin-bottom: 0;">
                            <label>Personal No.</label>
                            <input type="text" id="prof_personal_no" readonly class="bg-gray-100">
                        </div>
                        <div class="form-group" style="margin-bottom: 0;">
                            <label>Email</label>
                            <input type="email" id="prof_email">
                        </div>
                        <div class="form-group" style="margin-bottom: 0;">
                            <label>Mobile Number</label>
                            <input type="tel" id="prof_mobile_no">
                        </div>
                        <div class="form-group" style="margin-bottom: 0;">
                            <label>CGHS Beneficiary ID</label>
                            <input type="text" id="prof_cghs_ben_id">
                        </div>
                        <div class="form-group" style="margin-bottom: 0;">
                            <label>Pay Level</label>
                            <input type="text" id="prof_pay_level">
                        </div>
                        <div class="form-group" style="margin-bottom: 0;">
                            <label>Basic Pay (Rs.)</label>
                            <input type="text" id="prof_basic_pay">
                        </div>
                        <div class="form-group" style="margin-bottom: 0;">
                            <label>GPF A/C No.</label>
                            <input type="text" id="prof_gpf_ac_no" placeholder="e.g. 12345/AG">
                        </div>
                        <div class="form-group" style="margin-bottom: 0; grid-column: span 2;">
                            <label>Full Address</label>
                            <input type="text" id="prof_address">
                        </div>
                    </div>
                    <div id="profile-status-message" class="hidden" style="padding: 10px; margin-bottom: 15px; border-radius: 6px; font-weight: 600; font-size: 0.9rem; text-align: center; transition: all 0.3s ease;"></div>
                    <button type="submit" class="btn-primary w-full">Update Profile</button>
                </div>
                
                <!-- Right Side: Avatar -->
                <div class="profile-avatar-pane">
                    <div class="avatar-upload-container mx-auto">
                        <img id="profile-avatar" src="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><circle cx='12' cy='12' r='12' fill='%23e2e8f0'/><circle cx='12' cy='8' r='4' fill='%2394a3b8'/><path d='M12 14c-4.42 0-8 2.58-8 6v1c0 .55.45 1 1 1h14c.55 0 1-.45 1-1v-1c0-3.42-3.58-6-8-6z' fill='%2394a3b8'/></svg>" alt="Profile Photo" class="avatar-image">
                        <label for="avatar-input" class="avatar-edit-btn">
                            <span class="material-symbols-outlined">edit</span>
                        </label>
                        <input type="file" id="avatar-input" accept="image/*" class="hidden">
                    </div>
                    <p id="avatar-status" class="text-sm mt-2 text-muted hidden" style="text-align: center; font-weight: 600;"></p>
                </div>
            </div>
        </form>
    </div>

    <div class="form-container mx-auto max-w-800">
        <h3>Family Details (Dependents)</h3>
        
        <div class="family-tree-container mb-6">
            <div style="text-align: center; margin-bottom: -15px;">
                <svg width="160" height="90" viewBox="0 0 160 90" fill="none" xmlns="http://www.w3.org/2000/svg" style="opacity: 0.9;">
                    <path d="M80 5C80 5 65 45 15 50" stroke="#10b981" stroke-width="4" stroke-linecap="round"/>
                    <path d="M80 5C80 5 95 45 145 50" stroke="#10b981" stroke-width="4" stroke-linecap="round"/>
                    <path d="M80 2L80 80" stroke="#047857" stroke-width="6" stroke-linecap="round"/>
                    <circle cx="80" cy="5" r="8" fill="#10b981"/>
                    <circle cx="70" cy="16" r="7" fill="#34d399"/>
                    <circle cx="90" cy="16" r="7" fill="#34d399"/>
                    <circle cx="50" cy="28" r="9" fill="#059669"/>
                    <circle cx="110" cy="28" r="9" fill="#059669"/>
                    <circle cx="22" cy="42" r="8" fill="#10b981"/>
                    <circle cx="138" cy="42" r="8" fill="#10b981"/>
                </svg>
            </div>
            <div class="family-tree">
                <ul>
                    <li>
                        <div class="family-tree-node root-node">
                            <div style="font-weight: 800; color: var(--primary-color, #4f46e5); text-transform: uppercase; font-size: 9px; letter-spacing: 0.05em; margin-bottom: 4px;">Claimant / स्वयं</div>
                            <div id="tree_self_name" style="font-weight: 700; font-size: 13px; color: #1e293b;">Claimant</div>
                            <div style="color: #64748b; font-size: 10px; margin-top: 2px;">Self</div>
                        </div>
                        <ul id="dependents-tree-list">
                            <!-- Dependents will hang dynamically here! -->
                        </ul>
                    </li>
                </ul>
            </div>
        </div>

        <div class="table-container mb-6">
            <table>
                <thead>
                    <tr>
                        <th>Name</th>
                        <th>Relationship</th>
                        <th>CGHS Card ID</th>
                        <th>Date of Birth</th>
                        <th>Action</th>
                    </tr>
                </thead>
                <tbody id="dependents-table">
                </tbody>
            </table>
        </div>

        <h4 class="mt-5">Add / Edit Dependent</h4>
        <form id="dependent-form">
            <input type="hidden" id="dep_id">
            <div class="flex gap-4">
                <div class="form-group flex-1">
                    <label>Name</label>
                    <input type="text" id="dep_name" required>
                </div>
                <div class="form-group flex-1">
                    <label>Relationship</label>
                    <select id="dep_relationship" required>
                        <option value="">Select...</option>
                        <option value="Spouse">Spouse</option>
                        <option value="Husband">Husband</option>
                        <option value="Wife">Wife</option>
                        <option value="Son">Son</option>
                        <option value="Daughter">Daughter</option>
                        <option value="Father">Father</option>
                        <option value="Mother">Mother</option>
                        <option value="Brother">Brother</option>
                        <option value="Sister">Sister</option>
                        <option value="Father-in-law">Father-in-law</option>
                        <option value="Mother-in-law">Mother-in-law</option>
                    </select>
                </div>
            </div>
            <div class="flex gap-4">
                <div class="form-group flex-1">
                    <label>CGHS Card ID (Optional)</label>
                    <input type="text" id="dep_cghs_id">
                </div>
                <div class="form-group flex-1">
                    <label>Date of Birth</label>
                    <input type="date" id="dep_dob">
                </div>
            </div>
            <div class="flex gap-4 mt-5">
                <button type="submit" id="btn-save-dep" class="btn-primary">Save Dependent</button>
                <button type="button" id="btn-cancel-dep" class="btn-draft hidden">Cancel</button>
            </div>
        </form>
    </div>

    <script src="/assets/menu.js"></script>
    <script src="/assets/layout.js"></script>
    <script src="/assets/profile.js"></script>
</body>
</html>
