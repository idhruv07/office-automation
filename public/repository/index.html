<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document Repository - Office Automation</title>
    <link rel="stylesheet" href="/assets/style.css">
    <style>
        #repo-app {
            color: #f8fafc;
            font-family: 'Plus Jakarta Sans', sans-serif;
            min-height: 100vh;
        }
        .repo-container {
            display: flex;
            gap: 24px;
            height: calc(100vh - 120px);
            margin-top: 20px;
        }
        .repo-sidebar {
            flex: 0 0 320px;
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 16px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            overflow-y: auto;
            box-shadow: 0 8px 32px rgba(0,0,0,0.2);
        }
        .repo-content {
            flex: 1;
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 16px;
            padding: 24px;
            overflow-y: auto;
            box-shadow: 0 8px 32px rgba(0,0,0,0.2);
        }
        
        /* Tree Styles */
        .tree-node {
            margin: 4px 0;
            user-select: none;
        }
        .tree-node-content {
            display: flex;
            align-items: center;
            padding: 10px 14px;
            border-radius: 8px;
            cursor: pointer;
            color: var(--text-main, #0f172a);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            font-weight: 500;
        }
        .tree-node-content:hover {
            background: rgba(0, 0, 0, 0.05);
            color: var(--primary-color, #4f46e5);
            transform: translateX(4px);
        }
        .tree-node-content.selected {
            background: linear-gradient(90deg, var(--primary-color, #4f46e5), var(--primary-hover, #3730a3));
            color: white;
            box-shadow: 0 4px 12px rgba(79, 70, 229, 0.3);
        }
        .tree-node-content.drag-over {
            border: 2px dashed #818cf8;
            background: rgba(129, 140, 248, 0.1);
        }
        .tree-icon {
            margin-right: 12px;
            font-size: 18px;
            filter: drop-shadow(0 2px 4px rgba(0,0,0,0.2));
        }
        .tree-children {
            margin-left: 26px;
            border-left: 2px solid rgba(255, 255, 255, 0.05);
            padding-left: 8px;
            margin-top: 4px;
        }
        
        /* Document List */
        .doc-list {
            display: grid;
            gap: 16px;
        }
        .doc-item {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.05);
            padding: 20px;
            border-radius: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: all 0.3s ease;
            cursor: pointer;
        }
        .doc-item:hover {
            background: rgba(255, 255, 255, 0.06);
            border-color: rgba(255, 255, 255, 0.15);
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(0,0,0,0.15);
        }
        .doc-info h4 {
            margin: 0 0 6px 0;
            color: white;
            font-size: 17px;
            font-weight: 600;
            letter-spacing: 0.2px;
        }
        .doc-meta {
            font-size: 13px;
            color: #94a3b8;
            display: flex;
            gap: 12px;
            align-items: center;
        }
        .repo-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(0, 0, 0, 0.2);
            padding: 16px 24px;
            border-radius: 16px;
            border: 1px solid rgba(255,255,255,0.05);
            backdrop-filter: blur(10px);
            position: relative;
            z-index: 1001;
        }
        .repo-header h2 {
            background: linear-gradient(to right, #60a5fa, #c084fc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-size: 28px;
            font-weight: 800;
        }
        .btn-premium {
            background: linear-gradient(135deg, #3b82f6 0%, #8b5cf6 100%);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.3s;
            box-shadow: 0 4px 15px rgba(59, 130, 246, 0.4);
        }
        .btn-premium:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(59, 130, 246, 0.6);
        }

        /* Google-Style Pill Search Bar */
        .repo-search-container {
            display: flex;
            align-items: center;
            position: relative;
            background: white;
            border: 1px solid #dfe1e5;
            border-radius: 24px;
            height: 40px;
            width: 380px;
            transition: all 0.2s;
        }
        .repo-search-container:hover, .repo-search-container:focus-within {
            box-shadow: 0 1px 6px rgba(32,33,36,0.20);
            border-color: rgba(223,225,229,0);
        }
        .search-icon-svg {
            margin-left: 14px;
            margin-right: 8px;
            display: flex;
            align-items: center;
            pointer-events: none;
            z-index: 5;
        }
        .repo-search-input {
            border: none !important;
            background: transparent !important;
            color: #202124 !important;
            flex: 1;
            height: 100%;
            padding: 0 12px 0 0 !important;
            outline: none !important;
            font-size: 15px;
            font-family: var(--font-body);
            box-shadow: none !important;
        }
        .repo-search-input::placeholder {
            color: #9aa0a6;
        }
        .repo-search-results {
            display: none;
            position: absolute;
            top: calc(100% + 6px);
            left: 0;
            width: 100%;
            max-height: 320px;
            overflow-y: auto;
            background: white;
            border: 1px solid #dfe1e5;
            border-radius: 12px;
            z-index: 1000;
            box-shadow: 0 4px 12px rgba(32,33,36,0.15);
            padding: 6px;
        }
        .search-result-item {
            padding: 10px 14px;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.15s;
            text-align: left;
            margin-bottom: 2px;
        }
        .search-result-item:last-child {
            margin-bottom: 0;
        }
        .search-result-item:hover {
            background: #f1f3f4;
        }
        .search-result-title {
            font-weight: 600;
            color: #1a0dab;
            font-size: 14px;
            margin-bottom: 2px;
            text-align: left;
        }
        .search-result-item:hover .search-result-title {
            text-decoration: underline;
        }
        .search-result-path {
            font-size: 11px;
            color: #006621;
            display: flex;
            align-items: center;
            gap: 4px;
            text-align: left;
        }
        .search-result-snippet {
            font-size: 13px;
            color: #4d5156;
            margin-top: 4px;
            line-height: 1.4;
            text-align: left;
        }
        .search-snippet-match {
            font-weight: bold;
            color: #202124;
            background: transparent;
        }
    </style>
</head>
<body>
    <div id="repo-app" style="width: 100%;">
        <div class="repo-header">
            <div style="display: flex; align-items: center;">
                <h2 style="color: white; margin: 0; padding-right: 20px;">Document Repository</h2>
                <div class="repo-search-container">
                    <span class="search-icon-svg">
                        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2.5" stroke="currentColor" style="width: 18px; height: 18px; color: #64748b;">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
                        </svg>
                    </span>
                    <input id="global-search-input" type="text" placeholder="Search files, contents, metadata..." class="repo-search-input">
                    <div id="global-search-results" class="repo-search-results"></div>
                </div>
            </div>
            <div id="repo-actions">
                <!-- Buttons injected by JS based on permissions -->
            </div>
        </div>
        <div class="repo-container">
            <div class="repo-sidebar" id="folder-tree-container">
                <div style="color: #94a3b8; font-size: 14px; margin-bottom: 16px; display: flex; justify-content: space-between; align-items: center;">
                    <b>Folders</b>
                    <span id="new-folder-btn" style="cursor: pointer; display: none;" title="Create New Folder">➕</span>
                </div>
                <div id="folder-tree">
                    Loading tree...
                </div>
            </div>
            <div class="repo-content" id="document-list-container">
                <div style="text-align: center; color: #94a3b8; margin-top: 40px;">
                    Select a folder to view documents.
                </div>
            </div>
        </div>
    </div>

    <script src="/assets/menu.js"></script>
    <script src="/assets/layout.js"></script>
    <script src="/assets/repository.js"></script>
</body>
</html>
