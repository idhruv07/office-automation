<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Report Reminders - Office Auto</title>
    <link rel="stylesheet" href="/assets/style.css">
</head>
<body>
    <div class="main-content-container">
        <!-- Header Banner -->
        <div class="dash-hero" style="margin-bottom: 20px; display: flex; justify-content: space-between; align-items: center; background: linear-gradient(135deg, var(--primary-color) 0%, var(--accent-color) 100%); color: white; padding: 20px 28px; border-radius: 20px;">
            <div>
                <h1 class="dash-hero-title" style="margin: 0 0 6px 0; font-size: 24px; font-weight: 800; color: white;">📌 Report Reminders</h1>
                <p class="dash-hero-sub" style="margin: 0; opacity: 0.9; font-size: 14px;">Create, track, and manage one-off or recurring report reminders for yourself and your team (All times in IST).</p>
            </div>
            <button id="btn-open-create-modal" class="btn btn-primary" style="background: white; color: var(--primary-color); font-weight: 700; border: none; padding: 12px 20px; border-radius: 12px; cursor: pointer; display: flex; align-items: center; gap: 8px;">
                <span>➕ Create Reminder</span>
            </button>
        </div>

        <!-- Filter Tabs -->
        <div class="reminder-tabs-nav" style="display: flex; gap: 12px; margin-bottom: 20px; border-bottom: 2px solid var(--border-light); padding-bottom: 10px;">
            <button class="reminder-tab-btn active" data-tab="upcoming" style="padding: 10px 18px; border-radius: 10px; border: none; font-weight: 700; cursor: pointer;">⏳ Upcoming</button>
            <button class="reminder-tab-btn" data-tab="overdue" style="padding: 10px 18px; border-radius: 10px; border: none; font-weight: 700; cursor: pointer;">⚠️ Overdue</button>
            <button class="reminder-tab-btn" data-tab="completed" style="padding: 10px 18px; border-radius: 10px; border: none; font-weight: 700; cursor: pointer;">✅ Completed</button>
            <button class="reminder-tab-btn" data-tab="delegated" style="padding: 10px 18px; border-radius: 10px; border: none; font-weight: 700; cursor: pointer;">👥 Delegated</button>
        </div>

        <!-- Reminder Cards Container -->
        <div id="reminders-list-container" style="display: flex; flex-direction: column; gap: 14px;">
            <div style="text-align: center; padding: 40px; color: var(--text-muted);">Loading reminders...</div>
        </div>
    </div>

    <!-- Create Reminder Modal -->
    <div id="modal-create-reminder" class="modal-overlay" style="display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(15, 23, 42, 0.6); backdrop-filter: blur(4px); z-index: 20000; align-items: center; justify-content: center;">
        <div class="modal-box" style="background: white; border-radius: 20px; width: 90%; max-width: 500px; max-height: 90vh; overflow-y: auto; padding: 22px; box-shadow: var(--shadow-xl);">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; border-bottom: 1px solid var(--border-light); padding-bottom: 10px;">
                <h3 style="margin: 0; font-size: 18px; font-weight: 800; color: var(--text-main);">➕ Create Report Reminder</h3>
                <button id="btn-close-create-modal" style="background: none; border: none; font-size: 20px; cursor: pointer; color: var(--text-muted);">&times;</button>
            </div>

            <form id="form-create-reminder" style="display: flex; flex-direction: column; gap: 14px;">
                <div>
                    <label style="display: block; font-weight: 700; margin-bottom: 4px; font-size: 13px; color: var(--text-main);">Report Title <span style="color: var(--danger-color);">*</span></label>
                    <input type="text" id="rem-title" name="title" required placeholder="e.g. Q3 Sales Report" style="width: 100%; padding: 10px; border-radius: 8px; border: 1px solid var(--border-color); font-size: 13px;">
                </div>

                <div>
                    <label style="display: block; font-weight: 700; margin-bottom: 4px; font-size: 13px; color: var(--text-main);">Description / Guidelines</label>
                    <textarea id="rem-description" name="description" rows="2" placeholder="Specify details of what the report should cover..." style="width: 100%; padding: 10px; border-radius: 8px; border: 1px solid var(--border-color); font-size: 13px; font-family: inherit;"></textarea>
                </div>

                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 12px;">
                    <div>
                        <label style="display: block; font-weight: 700; margin-bottom: 4px; font-size: 13px; color: var(--text-main);">Due Date & Time (IST) <span style="color: var(--danger-color);">*</span></label>
                        <input type="datetime-local" id="rem-due-date" name="due_date" required style="width: 100%; padding: 10px; border-radius: 8px; border: 1px solid var(--border-color); font-size: 13px;">
                    </div>
                    <div>
                        <label style="display: block; font-weight: 700; margin-bottom: 4px; font-size: 13px; color: var(--text-main);">Urgency Level</label>
                        <select id="rem-urgency" name="urgency" style="width: 100%; padding: 10px; border-radius: 8px; border: 1px solid var(--border-color); font-size: 13px;">
                            <option value="Low">🟢 Low</option>
                            <option value="Medium" selected>🟡 Medium</option>
                            <option value="High">🔴 High</option>
                        </select>
                    </div>
                </div>

                <div>
                    <label style="display: block; font-weight: 700; margin-bottom: 4px; font-size: 13px; color: var(--text-main);">Assignees</label>
                    <div id="btn-select-assignees" style="width: 100%; padding: 10px; border-radius: 8px; border: 1px solid var(--border-color); font-size: 13px; background: white; cursor: pointer; display: flex; justify-content: space-between; align-items: center; box-sizing: border-box;">
                        <span id="assignee-summary-text">Selected: Self</span>
                        <span style="font-size: 10px; color: var(--text-muted);">▼</span>
                    </div>
                </div>

                <!-- Recurrence Rules -->
                <div style="background: var(--bg-main); padding: 12px; border-radius: 12px; border: 1px solid var(--border-light); font-size: 13px;">
                    <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 6px;">
                        <span style="font-weight: 700; color: var(--text-main);">🔄 Recurrence Pattern</span>
                        <select id="rec-type" style="padding: 6px; border-radius: 8px; border: 1px solid var(--border-color); font-size: 12px;">
                            <option value="none">One-off (No recurrence)</option>
                            <option value="daily">Daily</option>
                            <option value="weekly">Weekly</option>
                            <option value="monthly">Monthly</option>
                        </select>
                    </div>

                    <!-- Clean sentence wrapper for interval -->
                    <div id="rec-interval-wrap" style="display: none; align-items: center; gap: 8px; margin: 8px 0; background: white; padding: 6px 12px; border-radius: 8px; border: 1px solid var(--border-light);">
                        <span>Repeat every</span>
                        <input type="number" id="rec-interval" min="1" value="1" style="width: 50px; padding: 4px; border-radius: 6px; border: 1px solid var(--border-color); font-size: 12px; text-align: center;">
                        <span id="rec-unit-label">days</span>
                    </div>

                    <!-- Monthly specifics -->
                    <div id="rec-monthly-wrap" style="display: none; margin: 8px 0;">
                        <select id="rec-monthly-rule" style="width: 100%; padding: 6px; border-radius: 8px; border: 1px solid var(--border-color); font-size: 12px;">
                            <option value="same_day">On the same day of the month</option>
                            <option value="last_friday">On the last Friday of the month</option>
                        </select>
                    </div>

                    <!-- Clean end condition wrapper -->
                    <div id="rec-end-wrap" style="display: none; border-top: 1px solid var(--border-light); padding-top: 8px; margin-top: 8px;">
                        <div style="display: flex; align-items: center; gap: 10px; justify-content: space-between;">
                            <span style="font-weight: 700; color: var(--text-muted);">End recurrence:</span>
                            <select id="rec-end-type" style="padding: 6px; border-radius: 8px; border: 1px solid var(--border-color); font-size: 12px;">
                                <option value="never">Never (Repeat indefinitely)</option>
                                <option value="until_date">Until Specific Date</option>
                                <option value="count">After N occurrences</option>
                            </select>
                        </div>
                        
                        <div style="display: flex; justify-content: flex-end; margin-top: 6px;">
                            <input type="date" id="rec-end-date" style="display: none; padding: 6px; border-radius: 8px; border: 1px solid var(--border-color); font-size: 12px;">
                            <div id="rec-end-count-wrap" style="display: none; align-items: center; gap: 6px;">
                                <span>Stop after</span>
                                <input type="number" id="rec-end-count" min="1" value="5" style="width: 50px; padding: 4px; border-radius: 6px; border: 1px solid var(--border-color); font-size: 12px; text-align: center;">
                                <span>times</span>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Reference Attachments -->
                <div>
                    <label style="display: block; font-weight: 700; margin-bottom: 6px; font-size: 13px; color: var(--text-main);">📎 Reference File(s)</label>
                    <input type="file" id="rem-files" multiple style="width: 100%; padding: 8px; border: 1px dashed var(--border-color); border-radius: 10px; font-size: 13px; background: var(--bg-main);">
                </div>

                <div style="display: flex; justify-content: flex-end; gap: 10px; margin-top: 10px;">
                    <button type="button" id="btn-cancel-create" class="btn" style="background: var(--bg-main); border: 1px solid var(--border-color); padding: 10px 18px; border-radius: 10px; cursor: pointer;">Cancel</button>
                    <button type="submit" class="btn btn-primary" style="background: var(--primary-color); color: white; border: none; padding: 10px 22px; border-radius: 10px; font-weight: 700; cursor: pointer;">Save Reminder</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Assignee Selection Popup -->
    <div id="modal-select-assignees" style="display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(15, 23, 42, 0.4); z-index: 21000; align-items: center; justify-content: center;">
        <div style="background: white; border-radius: 16px; width: 90%; max-width: 380px; padding: 20px; box-shadow: var(--shadow-xl); display: flex; flex-direction: column; gap: 12px; box-sizing: border-box;">
            <div style="display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border-light); padding-bottom: 8px;">
                <h4 style="margin: 0; font-size: 15px; font-weight: 800; color: var(--text-main);">Select Assignees</h4>
                <button type="button" id="btn-close-assignees-modal" style="background: none; border: none; font-size: 18px; cursor: pointer; color: var(--text-muted);">&times;</button>
            </div>
            
            <input type="text" id="assignee-search" placeholder="🔍 Search name or designation..." style="width: 100%; padding: 8px 12px; border-radius: 8px; border: 1px solid var(--border-color); font-size: 13px; outline: none; box-sizing: border-box;">
            
            <div id="assignees-checkbox-list" style="max-height: 180px; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; padding: 4px 0; border: 1px solid var(--border-light); border-radius: 8px; padding: 8px; background: var(--bg-main); box-sizing: border-box;">
                <!-- Populate list items dynamically as checkbox rows -->
            </div>

            <div style="display: flex; justify-content: flex-end; gap: 8px; margin-top: 4px;">
                <button type="button" id="btn-confirm-assignees" style="background: var(--primary-color); color: white; border: none; padding: 8px 16px; border-radius: 8px; font-size: 12px; font-weight: 700; cursor: pointer;">Done</button>
            </div>
        </div>
    </div>

    <script src="/assets/menu.js"></script>
    <script src="/assets/layout.js"></script>
    <script src="/assets/reminders_client.js"></script>
</body>
</html>
